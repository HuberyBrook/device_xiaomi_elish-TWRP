name: TWRP - Build

# Credits to:
# https://github.com/TeamWin
# https://gitlab.com/OrangeFox
# https://github.com/azwhikaru for Recovery Builder Template
# https://github.com/carlodandan for Recovery Builder Template
# And all Contributors in every repositories I used

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'TWRP Manifest'
        required: true
        default: 'https://github.com/ymdzq/manifest_twrp'
      MANIFEST_BRANCH:
        description: 'TWRP Manifest Branch'
        required: true
        default: 'twrp-12.1'
      DEVICE_TREE:
        description: 'TWRP Device Tree'
        required: true
        default: 'https://github.com/ymdzq/device_xiaomi_elish-TWRP'
      DEVICE_TREE_BRANCH:
        description: 'TWRP Device Tree Branch'
        required: true
        default: 'android-12.1'
      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/xiaomi/elish'
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'dagu'
      MAKEFILE_NAME:
        description: 'Specify your Device Makefile Name'
        required: true
        default: 'twrp_dagu'
        type: choice
        options:
        - twrp_elish
        - twrp_enuma
        - twrp_dagu
        - twrp_pipa
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'boot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      USE_CCACHE:
        description: Use ccache for compilation
        type: boolean
        required: true
        default: true

jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Build Environment
      run: |
        sudo apt install aria2 -y
        git clone https://github.com/akhilnarang/scripts.git -b master
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      if: inputs.USE_CCACHE
      with:
        max-size: "10G"
        key: ${{ runner.os }}-${{ inputs.MANIFEST_BRANCH }}

    - name: Set-up Manifest
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/twrp
        cd ${GITHUB_WORKSPACE}/twrp
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        repo init --depth=1 -u ${{ inputs.MANIFEST_URL }} -b ${{ inputs.MANIFEST_BRANCH }}
        repo sync -j$(nproc --all) --force-sync

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/twrp
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV


    - name: Building TWRP
      run: |
        cd ${GITHUB_WORKSPACE}/twrp
        set +e
        if [[ ${{ inputs.USE_CCACHE }} == true ]]; then
        export USE_CCACHE=1
        export CCACHE_EXEC=/usr/bin/ccache
        sed -i 's/return sandboxConfig\.working/return false/g' build/soong/ui/build/sandbox_linux.go
        fi
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e
        lunch ${{ inputs.MAKEFILE_NAME }}-eng && make clean && mka adbd ${{ inputs.BUILD_TARGET }}image -j$(nproc --all)

    - name: Set Release Properties
      run: |
        echo "BUILD_DATE=$(TZ=Asia/Shanghai date +%Y%m%d)" >> $GITHUB_ENV
        cd ${GITHUB_WORKSPACE}/twrp

        if [ ${{ inputs.BUILD_TARGET }} == 'recovery' ]; then
           echo "BUILD_TARGET_NAME=recovery" >> $GITHUB_ENV
        elif [ ${{ inputs.BUILD_TARGET }} == 'boot' ]; then
           echo "BUILD_TARGET_NAME=boot" >> $GITHUB_ENV
        else
           echo "BUILD_TARGET_NAME=vendor_boot" >> $GITHUB_ENV
        fi

    - name: Locate build output
      run: |
        cd ${GITHUB_WORKSPACE}/twrp/out/target/product
        found=""
        for d in */; do
          if [ -f "${d}${{ env.BUILD_TARGET_NAME }}.img" ]; then
            found="${d%/}"
            ls -lh "${d}${{ env.BUILD_TARGET_NAME }}.img"
          fi
        done
        if [ -z "$found" ]; then
          echo "::error::No ${{ env.BUILD_TARGET_NAME }}.img found under out/target/product/"
          ls -laR . | head -50
          exit 1
        fi
        echo "BUILD_PRODUCT_DIR=$found" >> $GITHUB_ENV
        echo "Detected output dir: $found"

    # ---------------------------------------------------------------------
    # Fix device identity inside the recovery ramdisk.
    #
    # PRODUCT_DEVICE in twrp_dagu.mk has to stay "elish" (the whole device
    # tree is keyed off it: inherit chain, libinit_elish,
    # TARGET_INIT_VENDOR_LIB, prebuilt paths). buildinfo.sh therefore bakes
    # ro.product.device=elish and ro.build.product=elish into the ramdisk's
    # prop.default.
    #
    # AnyKernel3's update-binary cannot use getprop inside recovery (TWRP's
    # /system is not mounted yet at that point), so it falls back to
    # file_getprop on /default.prop and reads ro.build.product /
    # ro.product.vendor.device. Seeing "elish" instead of "dagu" makes every
    # AK3 kernel package abort with:
    #     Checking device...
    #     Unsupported device. Aborting...
    #
    # system.prop also overrides these, but this step is the hard guarantee:
    # it rewrites prop.default in the finished image, so the artifact is
    # always correct no matter how the build system orders properties.
    # ---------------------------------------------------------------------
    - name: Fix device identity in recovery ramdisk
      run: |
        set -euo pipefail
        WORK=${GITHUB_WORKSPACE}/twrp
        IMG="$WORK/out/target/product/${{ env.BUILD_PRODUCT_DIR }}/${{ env.BUILD_TARGET_NAME }}.img"
        DEVID="${{ inputs.DEVICE_NAME }}"

        # magiskboot is vendored in the device tree (prebuilt/dagu/magiskboot)
        # so the build does not depend on downloading from the Magisk release,
        # whose CDN redirects break behind some proxies.
        MAGISKBOOT="$WORK/${{ inputs.DEVICE_PATH }}/prebuilt/${{ inputs.DEVICE_NAME }}/magiskboot"
        TMP=$(mktemp -d)
        if [ -x "$MAGISKBOOT" ]; then
          echo "Using vendored magiskboot: $MAGISKBOOT"
          cp "$MAGISKBOOT" "$TMP/magiskboot"
        else
          echo "::warning::magiskboot not found in device tree, falling back to Magisk release"
          curl -fsSL --retry 3 -o "$TMP/magisk.apk" \
            https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
          ( cd "$TMP" && unzip -o -q magisk.apk 'lib/arm64-v8a/*' )
          cp "$TMP/lib/arm64-v8a/libmagiskboot.so" "$TMP/magiskboot"
        fi
        chmod +x "$TMP/magiskboot"
        "$TMP/magiskboot" --help > /dev/null 2>&1 || true

        cd "$TMP"
        rm -f kernel ramdisk.cpio header dtb extra second
        "$TMP/magiskboot" unpack "$IMG"
        ls -lh kernel ramdisk.cpio

        "$TMP/magiskboot" cpio ramdisk.cpio extract prop.default prop.default
        if [ ! -f prop.default ]; then
          echo "::error::prop.default not found in recovery ramdisk - cannot fix device identity"
          "$TMP/magiskboot" cpio ramdisk.cpio ls | head -40
          exit 1
        fi

        echo "--- before ---"
        grep -E '^ro\.(product\.device|build\.product|product\.vendor\.device|product\.system\.device)=' prop.default || true

        sed -i -E \
          -e "s/^ro\.build\.product=.*/ro.build.product=${DEVID}/" \
          -e "s/^ro\.product\.vendor\.device=.*/ro.product.vendor.device=${DEVID}/" \
          -e "s/^ro\.product\.system\.device=.*/ro.product.system.device=${DEVID}/" \
          prop.default

        for key in ro.product.device ro.build.product ro.product.vendor.device ro.product.system.device; do
          if ! grep -q "^${key}=" prop.default; then
            echo "${key}=${DEVID}" >> prop.default
          else
            sed -i -E "s|^${key}=.*|${key}=${DEVID}|" prop.default
          fi
        done

        echo "--- after ---"
        grep -E '^ro\.(product\.device|build\.product|product\.vendor\.device|product\.system\.device)=' prop.default

        "$TMP/magiskboot" cpio ramdisk.cpio "add 644 prop.default prop.default"
        "$TMP/magiskboot" repack "$IMG" new-boot.img
        mv -f new-boot.img "$IMG"

        echo "--- verify repacked image ---"
        rm -f ramdisk.cpio
        "$TMP/magiskboot" unpack "$IMG"
        "$TMP/magiskboot" cpio ramdisk.cpio extract prop.default prop.verify
        grep -E '^ro\.(product\.device|build\.product|product\.vendor\.device|product\.system\.device)=' prop.verify
        for key in ro.product.device ro.build.product ro.product.vendor.device ro.product.system.device; do
          grep -qx "${key}=${DEVID}" prop.verify || {
            echo "::error::${key} is not ${DEVID} in the repacked image"
            exit 1
          }
        done
        echo "Device identity verified as ${DEVID}"
        ls -lh "$IMG"

    - name: Upload to Release
      uses: softprops/action-gh-release@master
      with:
        files: |
          twrp/out/target/product/${{ env.BUILD_PRODUCT_DIR }}/${{ env.BUILD_TARGET_NAME }}.img
          twrp/out/target/product/${{ env.BUILD_PRODUCT_DIR }}/*.zip
        name: Unofficial TWRP for ${{ inputs.MAKEFILE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          ## TWRP Build - Unofficial
          Build: ${{ inputs.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ inputs.DEVICE_TREE }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}) during building.
